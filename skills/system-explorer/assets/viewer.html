 $('scenarios').replaceChildren();for(const s of model.scenarios){const b=button('',()=>chooseScenario(s),'nav-button'+(scenario===s?' active':''));b.append(el('strong',s.label),el('small',`${s.events.length} events · ${s.evidence.status}`));$('scenarios').append(b);}
 if(!model.scenarios.length)$('scenarios').append(el('p','Static model · no authored scenarios','hint'));
 $('overview').classList.toggle('active',!scenario&&!selection);
 const q=$('search').value.toLowerCase(),g=$('group').value;
 const found=model.entities.filter(e=>(!g||e.group===g)&&[e.label,e.kind,e.description].join(' ').toLowerCase().includes(q));
 $('entities').replaceChildren();for(const e of found){const b=button('',()=>chooseEntity(e),'nav-button'+(selection?.type==='entity'&&selection.item===e?' active':''));b.append(el('strong',e.label),el('small',[e.kind,e.group].filter(Boolean).join(' · ')));$('entities').append(b);}if(!found.length)$('entities').append(el('p','No matching entities','hint'));
}
function visibleEntities(){
 if(scenario){const ids=new Set(scenario.events.flatMap(endpoints));return model.entities.filter(e=>ids.has(e.id));}
 const q=$('search').value.toLowerCase(),g=$('group').value;
 return model.entities.filter(e=>(q||g||((e.parent_id||null)===scope))&&(!g||e.group===g)&&[e.label,e.kind,e.description].join(' ').toLowerCase().includes(q));
}
function makeSvg(width,height,label){const root=svg('svg',{viewBox:`0 0 ${width} ${height}`,role:'group','aria-label':label});const defs=svg('defs');for(const [id,color]of [['arrow','#93aaca'],['active-arrow','#078078']]){const marker=svg('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:color}));defs.append(marker);}root.append(defs);return root;}
function draw(){
 $('canvas').replaceChildren();$('crumbs').replaceChildren();$('crumbs').append(button('Overview',overview));
 if(scenario)$('crumbs').append(el('span','/ '+scenario.label));else if(scope){const trail=[];let e=entities.get(scope);while(e){trail.unshift(e);e=entities.get(e.parent_id);}for(const item of trail){$('crumbs').append(el('span','/'),button(item.label,()=>{scope=item.id;selection={type:'entity',item};render();}));}}
 $('map-tab').classList.toggle('active',view==='map');$('sequence-tab').classList.toggle('active',view==='sequence');$('map-tab').setAttribute('aria-pressed',view==='map');$('sequence-tab').setAttribute('aria-pressed',view==='sequence');
 if(view==='sequence'){drawSequence();return;}

 const positions=new Map();const cols=Math.min(3,Math.max(1,Math.ceil(Math.sqrt(nodes.length))));
 nodes.forEach((e,i)=>positions.set(e.id,{x:e.x??(150+(i%cols)*280),y:e.y??(115+Math.floor(i/cols)*195)}));
 const padX=Math.max(0,110-Math.min(...[...positions.values()].map(p=>p.x))),padY=Math.max(0,135-Math.min(...[...positions.values()].map(p=>p.y)));for(const p of positions.values()){p.x+=padX;p.y+=padY;}
 const width=Math.max(700,...[...positions.values()].map(p=>p.x+140)),height=Math.max(440,...[...positions.values()].map(p=>p.y+105));const root=makeSvg(width,height,'System topology');
 const visibleEdges=model.relationships.filter(e=>positions.has(e.from)&&positions.has(e.to)),now=eventNow(),activeIds=new Set(now?endpoints(now):[]),st=states();
 for(const edge of visibleEdges){
  const a=positions.get(edge.from),b=positions.get(edge.to);const siblings=visibleEdges.filter(e=>(e.from===edge.from&&e.to===edge.to)||(e.from===edge.to&&e.to===edge.from));const ordinal=siblings.indexOf(edge),offset=(ordinal-(siblings.length-1)/2)*36;
  let path,lx,ly;
  if(edge.from===edge.to){const lift=74+ordinal*25;path=`M ${a.x-40} ${a.y-38} C ${a.x-100} ${a.y-lift-70},${a.x+100} ${a.y-lift-70},${a.x+40} ${a.y-38}`;lx=a.x;ly=a.y-lift-22;}
  else{const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,clip=Math.min(87/(Math.abs(dx)||.0001),40/(Math.abs(dy)||.0001));const sx=a.x+dx*clip,sy=a.y+dy*clip,tx=b.x-dx*clip,ty=b.y-dy*clip;const direction=edge.from<edge.to?1:-1;const cx=(sx+tx)/2-dy/len*offset*direction,cy=(sy+ty)/2+dx/len*offset*direction;path=`M ${sx} ${sy} Q ${cx} ${cy} ${tx} ${ty}`;lx=(sx+2*cx+tx)/4;ly=(sy+2*cy+ty)/4-8;}
  const isCurrent=now?.relationship_id===edge.id,selected=selection?.type==='relationship'&&selection.item===edge;
  const g=svg('g',{class:`edge${isCurrent?' current':''}${selected?' selected':''}`});accessible(g,`Inspect relationship: ${edge.label}`,()=>inspect('relationship',edge));
  g.append(svg('path',{d:path,class:'hit'}),svg('path',{d:path,class:'wire','marker-end':`url(#${isCurrent?'active-arrow':'arrow'})`}));
  const label=edge.label.length>34?edge.label.slice(0,32)+'…':edge.label;g.append(svg('rect',{x:lx-label.length*2.8-5,y:ly-11,width:label.length*5.6+10,height:15,rx:4,fill:'#fbfcfe'}),svg('text',{x:lx,y:ly,'text-anchor':'middle'},label));root.append(g);
 }
 for(const e of nodes){const p=positions.get(e.id),isSelected=selection?.type==='entity'&&selection.item===e;const g=svg('g',{class:`entity${activeIds.has(e.id)?' participant':''}${isSelected?' selected':''}`,transform:`translate(${p.x},${p.y})`});accessible(g,`Inspect entity: ${e.label}`,()=>inspect('entity',e));g.append(svg('rect',{x:-87,y:-40,width:174,height:80,rx:10,class:'card'}),svg('text',{x:-73,y:-20,fill:'#7184a0','font-size':9,'letter-spacing':.7},e.kind.toUpperCase()),svg('text',{x:-73,y:1,fill:'#1d385e','font-size':13,'font-weight':600},e.label.length>23?e.label.slice(0,21)+'…':e.label),svg('text',{x:-73,y:22,class:'state-text'},st.get(e.id).length>27?st.get(e.id).slice(0,25)+'…':st.get(e.id)));if(model.entities.some(n=>n.parent_id===e.id))g.append(svg('text',{x:70,y:-19,fill:'#245edb','font-size':14},'⊞'));root.append(g);}
 $('canvas').append(root);$('map-note').textContent=`${nodes.length} entities · ${visibleEdges.length} relationships · ${scenario?'scenario participants':'current scope'}`;
}
function drawSequence(){
 if(!scenario||!scenario.events.length){$('canvas').append(el('div','Choose a scenario to inspect its ordered events.','empty'));$('map-note').textContent='Sequence follows authored order';return;}
 const ids=[...new Set(scenario.events.flatMap(endpoints))],width=Math.max(700,ids.length*195+80),height=Math.max(440,scenario.events.length*75+125),xs=new Map(ids.map((id,i)=>[id,140+i*(width-230)/Math.max(1,ids.length-1)]));const root=makeSvg(width,height,'Scenario sequence');

 $('canvas').append(root);$('map-note').textContent='Authored order · equal timestamps do not imply causal ordering';
}
function fact(parent,key,value){const row=el('div',undefined,'fact');row.append(el('span',key),el('b',typeof value==='string'?value:JSON.stringify(value)));parent.append(row);}
function evidence(parent,item){const ev=item.evidence;parent.append(el('h3','Evidence'),el('span',ev.status,'badge '+ev.status),el('p',ev.note));for(const id of ev.sources){const s=sources.get(id),d=el('div',undefined,'source');d.append(el('strong',s.label),el('br'));let url;try{url=new URL(s.uri);}catch{}if(url&&['http:','https:'].includes(url.protocol)){const a=el('a',s.uri);a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';d.append(a);}else d.append(el('span',s.uri));parent.append(d);}}
function details(){
 const box=$('inspector');box.replaceChildren();if(!selection){box.append(el('div','Model overview','eyebrow'),el('h2',model.title),el('p',model.description));fact(box,'Perspective',model.perspective);fact(box,'Entities',model.entities.length);fact(box,'Relationships',model.relationships.length);fact(box,'Scenarios',model.scenarios.length);box.append(el('h3','How to explore'),el('p','Select a scenario, then step through events. Click any entity or relationship for its details and evidence. Topology shows structure; Sequence shows the authored path.'),el('h3','Keyboard'),el('p','Space: play/pause. Arrow keys: previous/next event. Escape: reset scenario. Tab and Enter: inspect items.'));return;}
 const {type,item}=selection;box.append(el('div',type==='relationship'?'Relationship':type,'eyebrow'),el('h2',item.label),el('p',item.description));
 if(type==='entity'){fact(box,'Kind',item.kind);if(item.group)fact(box,'Group',item.group);fact(box,'State',states().get(item.id));if(item.parent_id)box.append(button('Within '+entities.get(item.parent_id).label,()=>chooseEntity(entities.get(item.parent_id)),'nav-button'));if(model.entities.some(n=>n.parent_id===item.id))box.append(button('Explore inside →',()=>{pause();scenario=null;index=-1;view='map';scope=item.id;$('search').value='';$('group').value='';render();},'nav-button'));box.append(el('h3','Connections'));for(const edge of model.relationships.filter(e=>e.from===item.id||e.to===item.id))box.append(button(`${entities.get(edge.from).label} → ${entities.get(edge.to).label}: ${edge.label}`,()=>inspect('relationship',edge),'nav-button'));}
 if(type==='relationship'){fact(box,'Kind',item.kind);box.append(button('From: '+entities.get(item.from).label,()=>inspect('entity',entities.get(item.from)),'nav-button'),button('To: '+entities.get(item.to).label,()=>inspect('entity',entities.get(item.to)),'nav-button'));}
 if(type==='event'){fact(box,'Position',`${index+1} of ${scenario.events.length}`);if(item.time_ms!==undefined)fact(box,'Time (ms)',item.time_ms);const [a,b]=endpoints(item);fact(box,'From',entities.get(a).label);fact(box,'To',entities.get(b).label);if(item.relationship_id)box.append(button('Inspect relationship →',()=>inspect('relationship',edges.get(item.relationship_id)),'nav-button'));if(Object.hasOwn(item,'payload')){box.append(el('h3','Payload / artifact'),el('pre',JSON.stringify(item.payload,null,2)));}if(item.state_changes){box.append(el('h3','State changes'));for(const [key,val]of Object.entries(item.state_changes))fact(box,entities.get(key).label,val);}}
 if(type==='scenario'&&item.outcome){box.append(el('h3','Outcome'),el('p',item.outcome));}
 if(item.properties){box.append(el('h3','Properties / contract'));for(const [key,val]of Object.entries(item.properties))fact(box,key,val);}
 evidence(box,item);
}
function timeline(){
 const events=scenario?.events||[];$('timeline-title').textContent=scenario?scenario.label:'Event timeline';$('progress').textContent=scenario?`${index+1} / ${events.length}`:'No scenario';$('prev').disabled=!scenario||index<0;$('next').disabled=!scenario||index>=events.length-1;$('reset').disabled=!scenario;$('play').disabled=!events.length;
 const wrap=$('timeline');wrap.replaceChildren();if(!events.length){wrap.append(el('div',scenario?'No authored events in this scenario.':'Select a scenario to trace a handoff, transfer, or state change.','empty'));return;}
 const table=el('table'),head=el('thead'),hr=el('tr');for(const label of ['#','Time (ms)','From → To','Event','Evidence'])hr.append(el('th',label));head.append(hr);table.append(head);const body=el('tbody');events.forEach((ev,i)=>{const row=el('tr',undefined,index===i?'current':i<index?'past':'');row.dataset.eventId=ev.id;const [a,b]=endpoints(ev);row.append(el('td',String(i+1)),el('td',ev.time_ms===undefined?'—':String(ev.time_ms)),el('td',a===b?entities.get(a).label:`${entities.get(a).label} → ${entities.get(b).label}`));const label=el('td');label.append(button(ev.label,()=>go(i)));row.append(label,el('td',ev.evidence.status));row.onclick=()=>go(i);body.append(row);});table.append(body);wrap.append(table);
}
function render(){nav();draw();details();timeline();}
$('title').textContent=model.title;document.title=model.title+' · System Explorer';$('perspective').textContent=model.perspective+' model';$('perspective').classList.add(model.perspective);
$('group').append(new Option('All groups',''));for(const group of [...new Set(model.entities.map(e=>e.group).filter(Boolean))].sort())$('group').append(new Option(group,group));
$('overview').onclick=overview;$('search').oninput=()=>{nav();if(!scenario)draw();};$('group').onchange=()=>{nav();if(!scenario)draw();};$('map-tab').onclick=()=>{view='map';draw();};$('sequence-tab').onclick=()=>{view='sequence';draw();};$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('play').onclick=play;$('reset').onclick=()=>go(-1);$('speed').onchange=()=>{if(timer!==null){pause();timer=setTimeout(tick,1100/Number($('speed').value));$('play').textContent='Pause';}};
$('download').onclick=()=>{const blob=new Blob([JSON.stringify(model,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='model.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName)||e.target.isContentEditable||e.target.getAttribute('role')==='button')return;if(e.code==='Space'){e.preventDefault();play();}if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key==='Escape')go(-1);});
render();
</script>
